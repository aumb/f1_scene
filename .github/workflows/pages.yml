# Builds the web app and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repository: Settings > Pages > Build and deployment >
# Source: GitHub Actions.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Pages serves the site under /<repository>/.
      # WebAssembly where the browser supports it (WasmGC: Chrome and Edge
      # 119+, Firefox 120+, Safari 18.2+); the same build carries the
      # JavaScript version, which the loader picks everywhere else.
      - run: flutter build web --release --wasm --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
