name: f1_scene
description: "Formula 1 race replays on 3D circuit dioramas, built with flutter_scene."
repository: https://github.com/aumb/f1_scene
issue_tracker: https://github.com/aumb/f1_scene/issues
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.0
  hooks: ^2.2.0
  http: ^1.6.0
  vector_math: ^2.4.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/circuits/
    - assets/circuits/layouts/
    - assets/circuits/elevations/
    - assets/circuits/markers/
    - assets/circuits/widths/
    # What flutter_scene's build hook (hook/build.dart) compiles from .glb,
    # .fscene and .fmat files under assets/. This app builds its meshes in
    # code, so these stay empty; they are here for when it doesn't.
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web
  uses-material-design: true
